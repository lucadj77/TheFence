<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bug - Risposte Inconsistenti</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: white;
        }
        .bug-found {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        .ok {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #1976d2;
        }
        .scheda-test {
            background: #fff3cd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        pre {
            background: #263238;
            color: #aed581;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Test Bug - Risposte Inconsistenti</h1>
    <p>Questo test dimostra che le risposte per i Giocatori A e B vengono calcolate in modo inconsistente.</p>

    <button onclick="eseguiTest()">▶️ Esegui Test (100 iterazioni)</button>

    <div id="risultati"></div>

    <script>
        // Configurazione di test
        const RIGHE = {
            1: ['A', 'B', 'C', 'D'],
            2: ['E', 'F', 'G', 'H'],
            3: ['I', 'J', 'K', 'L'],
            4: ['M', 'N', 'O', 'P']
        };

        const COLONNE = {
            1: ['A', 'E', 'I', 'M'],
            2: ['B', 'F', 'J', 'N'],
            3: ['C', 'G', 'K', 'O'],
            4: ['D', 'H', 'L', 'P']
        };

        // Simula la funzione bugata dal codice originale
        function calcolaRispostaBugata(scheda, carta) {
            const zona = carta.tipo === 'riga' ? RIGHE[carta.zona] : COLONNE[carta.zona];
            const oggettoCercato = carta.oggetto;

            const caselleConOggetto = zona.filter(c => scheda[c] === oggettoCercato);
            const quantita = caselleConOggetto.length;

            let rispostaB;
            if (quantita === 0) {
                rispostaB = 'Quantità: 0';
            } else {
                // ⚠️ QUESTO È IL BUG: randomness ad ogni chiamata
                const casellaCasuale = caselleConOggetto[Math.floor(Math.random() * caselleConOggetto.length)];
                rispostaB = `Posizione: ${casellaCasuale}`;
            }

            return {
                rispostaA: `Quantità: ${quantita}`,
                rispostaB: rispostaB
            };
        }

        // Simula il comportamento del gioco
        function simulaGiocoConBug(scheda, carta) {
            // Giocatore A clicca per vedere la risposta
            const rispostePerA = calcolaRispostaBugata(scheda, carta);

            // Giocatore B clicca per vedere la risposta (CHIAMATA SEPARATA!)
            const rispostePerB = calcolaRispostaBugata(scheda, carta);

            return {
                rispostaA1: rispostePerA.rispostaA,
                rispostaB1: rispostePerA.rispostaB,
                rispostaA2: rispostePerB.rispostaA,
                rispostaB2: rispostePerB.rispostaB
            };
        }

        function eseguiTest() {
            const risultatiDiv = document.getElementById('risultati');
            risultatiDiv.innerHTML = '<h2>Esecuzione test...</h2>';

            // Crea una scheda di test con casi noti
            const schedaTest = {
                'A': 0, 'B': 1, 'C': 2, 'D': 3,
                'E': 0, 'F': 1, 'G': 2, 'H': 3,
                'I': 0, 'J': 1, 'K': 2, 'L': 3,
                'M': 0, 'N': 1, 'O': 2, 'P': 3
            };

            // Carta di test: oggetto 0 in riga 1 (caselle A, B, C, D)
            // Nella scheda sopra: A=0, E=0, I=0, M=0 (colonna 1 ha 4 copie dell'oggetto 0)
            // Riga 1: A=0, B=1, C=2, D=3 (solo 1 copia dell'oggetto 0 in posizione A)

            const cartaTest = { tipo: 'colonna', zona: 1, oggetto: 0 };

            let bugTrovati = 0;
            let testEseguiti = 100;
            let esempiDiversi = [];

            for (let i = 0; i < testEseguiti; i++) {
                const risultato = simulaGiocoConBug(schedaTest, cartaTest);

                // Le risposte A dovrebbero essere sempre uguali
                const rispostaACoerente = risultato.rispostaA1 === risultato.rispostaA2;

                // Le risposte B potrebbero essere diverse (BUG!)
                const rispostaBCoerente = risultato.rispostaB1 === risultato.rispostaB2;

                if (!rispostaBCoerente) {
                    bugTrovati++;
                    if (esempiDiversi.length < 5) {
                        esempiDiversi.push(risultato);
                    }
                }
            }

            // Mostra risultati
            let html = `
                <div class="scheda-test">
                    <h3>📋 Scheda di Test</h3>
                    <pre>Colonna 1: A=0, E=0, I=0, M=0 (4 oggetti tipo 0)
Carta testata: Oggetto 0 in Colonna 1
Risposta attesa:
  - Giocatore A: "Quantità: 4"
  - Giocatore B: "Posizione: [A, E, I o M]" (casuale, ma DEVE essere la stessa per entrambe le chiamate!)
</pre>
                </div>
            `;

            if (bugTrovati > 0) {
                html += `
                    <div class="test-result bug-found">
                        <h3>❌ BUG CONFERMATO!</h3>
                        <p><strong>${bugTrovati} su ${testEseguiti}</strong> test hanno mostrato inconsistenze nelle risposte B.</p>
                        <p>Questo dimostra che chiamare <code>calcolaRisposta()</code> due volte produce risultati diversi a causa della randomness.</p>
                    </div>
                `;

                if (esempiDiversi.length > 0) {
                    html += `<h3>Esempi di inconsistenze trovate:</h3>`;
                    esempiDiversi.forEach((esempio, idx) => {
                        html += `
                            <div class="test-result">
                                <strong>Esempio ${idx + 1}:</strong>
                                <ul>
                                    <li>Prima chiamata (per mostrare a Giocatore A): Risposta B = "${esempio.rispostaB1}"</li>
                                    <li>Seconda chiamata (per mostrare a Giocatore B): Risposta B = "${esempio.rispostaB2}"</li>
                                    <li style="color: #f44336"><strong>⚠️ Le risposte B sono DIVERSE!</strong></li>
                                </ul>
                            </div>
                        `;
                    });
                }
            } else {
                html += `
                    <div class="test-result ok">
                        <h3>✅ Nessuna inconsistenza trovata in questo test</h3>
                        <p>Nota: Con solo 1 oggetto nella zona, non ci sarebbe randomness. Prova con più oggetti.</p>
                    </div>
                `;
            }

            html += `
                <h3>🔧 Soluzione Proposta</h3>
                <div class="test-result">
                    <p>Le risposte devono essere calcolate <strong>UNA SOLA VOLTA</strong> quando viene confermata la carta e poi salvate:</p>
                    <pre>
// Variabili globali per salvare le risposte
let risposteCalcolate = null;

function confermaCarta() {
    // ... codice esistente ...

    // Calcola le risposte UNA SOLA VOLTA
    risposteCalcolate = calcolaRisposta();

    // ... resto del codice ...
}

function mostraRispostaA() {
    // Usa le risposte già calcolate
    document.getElementById('risposta-a').textContent = risposteCalcolate.rispostaA;
    // ...
}

function mostraRispostaB() {
    // Usa le risposte già calcolate
    document.getElementById('risposta-b').textContent = risposteCalcolate.rispostaB;
    // ...
}
                    </pre>
                </div>
            `;

            risultatiDiv.innerHTML = html;
        }

        // Esegui automaticamente all'avvio
        window.onload = () => {
            setTimeout(eseguiTest, 500);
        };
    </script>
</body>
</html>
