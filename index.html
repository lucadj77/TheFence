<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fence</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
            padding: 20px;
            overflow-x: hidden;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 16px 12px;
            }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c23a51);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-player-a {
            background: linear-gradient(135deg, #4a90a4, #357a8c);
            color: white;
        }

        .btn-player-a:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 144, 164, 0.4);
        }

        .btn-player-b {
            background: linear-gradient(135deg, #a4904a, #8c7a35);
            color: white;
        }

        .btn-player-b:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(164, 144, 74, 0.4);
        }

        .btn-close {
            background: linear-gradient(135deg, #666, #555);
            color: white;
        }

        .btn-close:hover {
            background: linear-gradient(135deg, #777, #666);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-debug {
            background: rgba(100, 100, 100, 0.3);
            color: #999;
            font-size: 0.9rem;
            padding: 12px;
        }

        .btn-debug:hover {
            background: rgba(100, 100, 100, 0.5);
        }

        .btn-accusa {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
        }

        .btn-accusa:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.4);
        }

        input[type="number"] {
            width: 100%;
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e8e8e8;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 16px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #e94560;
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .response-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
            font-size: 1.2rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .response-a {
            border-left: 4px solid #4a90a4;
        }

        .response-b {
            border-left: 4px solid #a4904a;
        }

        .hidden {
            display: none;
        }

        .grid-soluzione {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
            width: 100%;
        }

        .cella {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            font-size: 0.85rem;
        }

        .cella-label {
            font-weight: bold;
            color: #e94560;
            display: block;
            margin-bottom: 4px;
        }

        .colpevole-info {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2), rgba(233, 69, 96, 0.1));
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            text-align: center;
        }

        .accusa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .accusa-btn {
            padding: 12px 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #e8e8e8;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .accusa-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .accusa-btn.selected {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }

        .oggetti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .esito {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .esito-vittoria {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(39, 174, 96, 0.2));
            border: 2px solid #2ecc71;
            color: #2ecc71;
        }

        .esito-sconfitta {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.3), rgba(192, 57, 43, 0.2));
            border: 2px solid #e74c3c;
            color: #e74c3c;
        }

        .carta-info {
            text-align: center;
            color: #aaa;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .oggetto-nome {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 0 2px;
        }
    
        .oggetto-img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            margin: 2px;
        }

        .oggetto-img-grande {
            width: 48px;
            height: 48px;
        }

        .cella .oggetto-img {
            width: 28px;
            height: 28px;
        }

        .accusa-btn .oggetto-img {
            width: 40px;
            height: 40px;
        }

        .personaggio-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .accusa-btn.personaggio-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
        }


        /* Tabellone visuale */
        .tabellone-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, auto);
            gap: 3px;
            max-width: 380px;
            width: 100%;
            margin: 0 auto 16px;
            padding: 0;
        }

        .tabellone-wrapper {
            width: 100%;
            overflow: hidden;
        }

        @media (max-width: 500px) {
            .tabellone-container {
                transform: scale(0.85);
                transform-origin: top center;
                margin-bottom: -20px;
            }
        }

        @media (max-width: 400px) {
            .tabellone-container {
                transform: scale(0.75);
                transform-origin: top center;
                margin-bottom: -40px;
            }
        }

        .casella-obj {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .casella-obj .label {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 2px;
        }

        .casella-obj .oggetto-img {
            width: 28px;
            height: 28px;
        }

        .personaggio-cell {
            background: rgba(74, 144, 164, 0.2);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 55px;
            border: 1px solid rgba(74, 144, 164, 0.4);
            font-size: 0.7rem;
            color: #e8e8e8;
        }

        .personaggio-cell.colpevole {
            background: rgba(233, 69, 96, 0.4);
            border: 2px solid #e94560;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.6);
        }

        .personaggio-cell img {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            margin-bottom: 2px;
        }

        .personaggio-cell .nome {
            font-weight: 600;
            font-size: 0.65rem;
            text-align: center;
        }

        .cell-spacer {
            /* Celle vuote per il layout */
        }

        .info-soluzione {
            text-align: center;
            padding: 16px 20px;
            background: rgba(233, 69, 96, 0.2);
            border-radius: 12px;
            margin: 16px auto 0;
            border: 1px solid rgba(233, 69, 96, 0.4);
            max-width: 300px;
        }

        .info-soluzione .titolo {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e94560;
        }


        .divider {
            text-align: center;
            margin: 20px 0;
            color: #888;
            font-size: 0.9rem;
        }

        #input-codice {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-family: monospace;
        }

        .codice-partita {
            background: rgba(74, 144, 164, 0.2);
            border: 1px solid rgba(74, 144, 164, 0.4);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .codice-partita .label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 4px;
        }

        .codice-partita .codice {
            font-size: 1.4rem;
            font-family: monospace;
            letter-spacing: 3px;
            color: #4a90a4;
            font-weight: bold;
            user-select: all;
        }

        .accusa-btn.oggetto-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>The Fence</h1>

        <!-- Schermata iniziale -->
        <div id="schermata-iniziale" class="card">
            <!-- Scelta modalità -->
            <div id="scelta-modalita">
                <label class="label">Modalità di gioco</label>
                <button class="btn btn-primary" onclick="scegliModalita('locale')">Gioco Locale (stesso dispositivo)</button>
                <button class="btn btn-primary" onclick="scegliModalita('remoto')">Gioco Remoto (due dispositivi)</button>
            </div>

            <!-- Setup partita (nascosto inizialmente) -->
            <div id="setup-partita" class="hidden">
                <!-- Selezione giocatore (solo per modalità remota) -->
                <div id="selezione-giocatore" class="hidden">
                    <label class="label">Sei il giocatore...</label>
                    <button class="btn btn-player-a" onclick="scegliGiocatore(1)">Giocatore 1 (inizi tu)</button>
                    <button class="btn btn-player-b" onclick="scegliGiocatore(2)">Giocatore 2</button>
                    <div class="divider"></div>
                </div>

                <button class="btn btn-primary" onclick="nuovaPartita()">Nuova partita</button>

                <div class="divider">oppure</div>

                <label class="label">Inserisci codice partita</label>
                <input type="text" id="input-codice" placeholder="es. A7K2MX" maxlength="7" style="text-transform: uppercase;">
                <button class="btn btn-secondary" onclick="caricaPartita()">Carica partita</button>
            </div>
        </div>

        <!-- Schermata di gioco -->
        <div id="schermata-gioco" class="card hidden">
            <div class="codice-partita">
                <div class="label">Codice partita</div>
                <div class="codice" id="codice-display">------</div>
            </div>

            <!-- Indicatore turno (solo modalità remota) -->
            <div id="indicatore-turno" class="hidden" style="text-align: center; margin: 16px 0; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">
                <div class="label" style="margin-bottom: 4px;">Turno corrente</div>
                <div id="turno-display" style="font-size: 1.2rem; font-weight: bold; color: #e94560;"></div>
            </div>

            <label class="label">Inserisci il numero della carta (1-32)</label>
            <input type="number" id="input-carta" min="1" max="32" placeholder="1-32">
            <button class="btn btn-primary" id="btn-conferma" onclick="confermaCarta()">Conferma</button>

            <div id="area-risposte" class="hidden">
                <div class="carta-info" id="carta-info"></div>
                
                <div id="btn-container-a">
                    <button class="btn btn-player-a" id="btn-giocatore-a" onclick="mostraRispostaA()">
                        Giocatore A (chi ha giocato)
                    </button>
                </div>
                <div id="risposta-a" class="response-box response-a hidden"></div>
                <button class="btn btn-close hidden" id="btn-chiudi-a" onclick="chiudiRispostaA()">Chiudi</button>

                <div id="btn-container-b">
                    <button class="btn btn-player-b" id="btn-giocatore-b" onclick="mostraRispostaB()">
                        Giocatore B (avversario)
                    </button>
                </div>
                <div id="risposta-b" class="response-box response-b hidden"></div>
                <button class="btn btn-close hidden" id="btn-chiudi-b" onclick="chiudiRispostaB()">Chiudi</button>

                <button class="btn btn-secondary hidden" id="btn-prossima" onclick="prossimaDomanda()">
                    Prossima domanda
                </button>
            </div>
        </div>

        <!-- Pulsante accusa -->
        <div id="area-accusa" class="card hidden">
            <button class="btn btn-accusa" onclick="apriAccusa()">Accusa</button>
        </div>

        <!-- Schermata accusa -->
        <div id="schermata-accusa" class="card hidden">
            <h3 style="margin-bottom: 16px; text-align: center;">Seleziona il colpevole</h3>
            <div class="accusa-grid" id="grid-personaggi"></div>
            
            <h3 style="margin-bottom: 16px; text-align: center;">Seleziona l'oggetto rubato</h3>
            <div class="oggetti-grid" id="grid-oggetti"></div>

            <button class="btn btn-primary" id="btn-conferma-accusa" onclick="confermaAccusa()" disabled>
                Conferma accusa
            </button>
            <button class="btn btn-secondary" onclick="chiudiAccusa()">Annulla</button>
        </div>

        <!-- Esito accusa -->
        <div id="schermata-esito" class="card hidden">
            <div id="esito-messaggio" class="esito"></div>
            <div id="soluzione-finale" class="hidden"></div>
            <button class="btn btn-primary" onclick="nuovaPartita()" style="margin-top: 20px;">Nuova partita</button>
        </div>

        <!-- Debug -->
        <div class="card">
            <label class="label">Password debug</label>
            <input type="password" id="input-password" placeholder="Inserisci password" style="width: 100%; padding: 12px; border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(0, 0, 0, 0.3); color: #e8e8e8; font-size: 1rem; margin-bottom: 12px;">
            <button class="btn btn-debug" onclick="mostraSoluzione()">Mostra soluzione (debug)</button>
        </div>

        <!-- Soluzione debug -->
        <div id="schermata-soluzione" class="card hidden">
            <h3 style="margin-bottom: 16px; text-align: center;">Scheda completa</h3>
            <div class="grid-soluzione" id="grid-soluzione"></div>
            <div id="info-colpevole" class="colpevole-info"></div>
            <button class="btn btn-secondary" onclick="chiudiSoluzione()" style="margin-top: 16px;">Chiudi</button>
        </div>
    </div>

        let rispostaAVista = false;

        // Funzioni per codice partita
        function codificaScheda() {
            // Codifica 16 valori (0-3) in una stringa base36
            let numero = 0n;
            for (let i = 0; i < 16; i++) {
                numero = numero * 4n + BigInt(scheda[CASELLE[i]]);
            }
            return numero.toString(36).toUpperCase().padStart(7, '0');
        }

        function decodificaScheda(codice) {
            try {
                codice = codice.toUpperCase().trim();
                if (!/^[0-9A-Z]{1,7}$/.test(codice)) return false;
                
                let numero = BigInt(parseInt(codice, 36));
                let schedaTemp = {};
                
                for (let i = 15; i >= 0; i--) {
                    schedaTemp[CASELLE[i]] = Number(numero % 4n);
                    numero = numero / 4n;
                }
                
                // Verifica validità
                let personaggiCon3 = [];
                for (let p = 1; p <= 9; p++) {
                    const caselle = ADIACENZE[p];
                    const conteggio = [0, 0, 0, 0];
                    for (const c of caselle) {
                        conteggio[schedaTemp[c]]++;
                    }
                    if (Math.max(...conteggio) === 3) {
                        personaggiCon3.push({ personaggio: p, oggetto: conteggio.indexOf(3) });
                    }
                }
                
                if (personaggiCon3.length !== 1) return false;
                
                const totali = [0, 0, 0, 0];
                for (const c of CASELLE) {
                    totali[schedaTemp[c]]++;
                }
                if (!totali.every(t => t === 4)) return false;
                
                scheda = schedaTemp;
                colpevole = personaggiCon3[0].personaggio;
                refurtivo = personaggiCon3[0].oggetto;
                return true;
            } catch (e) {
                console.error('Errore decodifica:', e);
                return false;
            }
        }

        function caricaPartita() {
            if (modalitaGioco === 'remoto' && !giocatoreCorrente) {
                alert('Seleziona prima se sei Giocatore 1 o Giocatore 2');
                return;
            }

            const codice = document.getElementById('input-codice').value;
            if (!codice) {
                alert('Inserisci un codice partita');
                return;
            }

            if (!decodificaScheda(codice)) {
                alert('Codice partita non valido');
                return;
            }

            turnoCorrente = 1; // Inizia sempre il Giocatore 1
            console.log('Partita caricata da codice: ' + codice);
            avviaGioco();
        }

            return `<img src="${IMG_PERSONAGGI[indice]}" style="width: ${size}px; height: ${size}px; border-radius: 8px;" alt="${NOMI_PERSONAGGI[indice-1]}" title="${NOMI_PERSONAGGI[indice-1]}">`;
        }

        function getOggettoImg(indice, grande = false) {
            const classe = grande ? 'oggetto-img oggetto-img-grande' : 'oggetto-img';
            return `<img src="${IMG_OGGETTI[indice]}" class="${classe}" alt="${OGGETTI[indice]}" title="${OGGETTI[indice]}">`;
        }

        function getOggettoHtml(indice, conNome = true) {
            if (conNome) {
                return `${getOggettoImg(indice)} ${OGGETTI[indice]}`;
            }
            return getOggettoImg(indice);
        }


        // Mappa carte
        const CARTE = {};
        let cartaNum = 1;
        for (let riga = 1; riga <= 4; riga++) {
            for (let ogg = 0; ogg < 4; ogg++) {
                CARTE[cartaNum] = { tipo: 'riga', zona: riga, oggetto: ogg };
                cartaNum++;
            }
        }
        for (let col = 1; col <= 4; col++) {
            for (let ogg = 0; ogg < 4; ogg++) {
                CARTE[cartaNum] = { tipo: 'colonna', zona: col, oggetto: ogg };
                cartaNum++;
            }
        }

        let accusaPersonaggio = null;
        let accusaOggetto = null;
        let risposteCalcolate = null;

        // Variabili per modalità gioco remoto
        let modalitaGioco = 'locale'; // 'locale' o 'remoto'
        let giocatoreCorrente = 1; // 1 o 2 (identità del giocatore)
        let turnoCorrente = 1; // 1 o 2 (di chi è il turno)

        function generaScheda() {
            let tentativi = 0;
            const maxTentativi = 10000;

            // Fase 1: Scegli colpevole e oggetto uniformemente a caso
            const colpevoleTarget = Math.floor(Math.random() * 9) + 1;
            const oggettoTarget = Math.floor(Math.random() * 4);
            const caselleColpevole = ADIACENZE[colpevoleTarget];

            while (tentativi < maxTentativi) {
                tentativi++;
                
                // Crea array con 4 copie di ogni oggetto
                let oggetti = [];
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        oggetti.push(i);
                    }
                }

                // Mescola (Fisher-Yates)
                for (let i = oggetti.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [oggetti[i], oggetti[j]] = [oggetti[j], oggetti[i]];
                }

                // Assegna alle caselle
                let schedaTemp = {};
                for (let i = 0; i < 16; i++) {
                    schedaTemp[CASELLE[i]] = oggetti[i];
                }

                // Verifica che il colpevole target abbia esattamente 3 dell'oggetto target
                let conteggioTarget = 0;
                for (const c of caselleColpevole) {
                    if (schedaTemp[c] === oggettoTarget) conteggioTarget++;
                }
                if (conteggioTarget !== 3) continue;

                // Verifica che NESSUN altro personaggio abbia 3 oggetti uguali
                let valido = true;
                for (let p = 1; p <= 9; p++) {
                    if (p === colpevoleTarget) continue;
                    
                    const caselle = ADIACENZE[p];
                    const conteggio = [0, 0, 0, 0];
                    for (const c of caselle) {
                        conteggio[schedaTemp[c]]++;
                    }
                    
                    if (Math.max(...conteggio) >= 3) {
                        valido = false;
                        break;
                    }
                }

                if (valido) {
                    scheda = schedaTemp;
                    colpevole = colpevoleTarget;
                    refurtivo = oggettoTarget;
                    console.log(`Scheda generata in ${tentativi} tentativi (colpevole: ${NOMI_PERSONAGGI[colpevole-1]}, refurtivo: ${OGGETTI[refurtivo]})`);
                    return true;
                }
            }

            console.error('Impossibile generare scheda valida');
            return false;
        }

        function scegliModalita(modalita) {
            modalitaGioco = modalita;
            document.getElementById('scelta-modalita').classList.add('hidden');
            document.getElementById('setup-partita').classList.remove('hidden');

            if (modalita === 'remoto') {
                document.getElementById('selezione-giocatore').classList.remove('hidden');

        function scegliGiocatore(giocatore) {
            giocatoreCorrente = giocatore;

            document.querySelectorAll('#selezione-giocatore .btn').forEach(btn => {
                btn.style.opacity = '0.5';
            });
            event.target.style.opacity = '1';
        }

        function nuovaPartita() {
            if (modalitaGioco === 'remoto' && !giocatoreCorrente) {
                alert('Seleziona prima se sei Giocatore 1 o Giocatore 2');
                return;
            }

            if (!generaScheda()) {
                alert('Errore nella generazione della scheda. Riprova.');
                return;
            }

            turnoCorrente = 1; // Inizia sempre il Giocatore 1
            console.log(`Nuova partita - Codice: ${codificaScheda()}`);
            avviaGioco();
        }

        function avviaGioco() {
            document.getElementById('schermata-iniziale').classList.add('hidden');
            document.getElementById('schermata-gioco').classList.remove('hidden');
            document.getElementById('area-accusa').classList.remove('hidden');
            document.getElementById('schermata-accusa').classList.add('hidden');
            document.getElementById('schermata-esito').classList.add('hidden');
            document.getElementById('schermata-soluzione').classList.add('hidden');
            document.getElementById('area-risposte').classList.add('hidden');
            document.getElementById('input-carta').value = '';
            document.getElementById('codice-display').textContent = codificaScheda();

            // Genera griglia personaggi per accusa
            const gridPersonaggi = document.getElementById('grid-personaggi');
            gridPersonaggi.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'accusa-btn personaggio-btn';
                btn.innerHTML = getPersonaggioImg(i, true) + '<span>' + NOMI_PERSONAGGI[i-1] + '</span>';
                btn.onclick = () => selezionaPersonaggio(i, btn);
                gridPersonaggi.appendChild(btn);
            }

            // Genera griglia oggetti per accusa
            const gridOggetti = document.getElementById('grid-oggetti');
            gridOggetti.innerHTML = '';
            OGGETTI.forEach((nome, idx) => {
                const btn = document.createElement('button');
                btn.className = 'accusa-btn oggetto-btn';
                btn.innerHTML = getOggettoImg(idx, true) + '<span>' + nome + '</span>';
                btn.onclick = () => selezionaOggetto(idx, btn);
                gridOggetti.appendChild(btn);
            });

            accusaPersonaggio = null;
            accusaOggetto = null;

            // Mostra/nascondi indicatore turno in base alla modalità
            if (modalitaGioco === 'remoto') {
                document.getElementById('indicatore-turno').classList.remove('hidden');
                aggiornaInterfacciaTurno();
            } else {
                document.getElementById('indicatore-turno').classList.add('hidden');
            }
        }

        function aggiornaInterfacciaTurno() {
            if (modalitaGioco !== 'remoto') return;

            const isMioTurno = (giocatoreCorrente === turnoCorrente);
            const turnoDisplay = document.getElementById('turno-display');

            if (isMioTurno) {
                turnoDisplay.textContent = '🎯 È il tuo turno!';
                turnoDisplay.style.color = '#4caf50';
            } else {
                turnoDisplay.textContent = `Turno del Giocatore ${turnoCorrente}`;
                turnoDisplay.style.color = '#ff9800';
            }
        }

        function confermaCarta() {
            const input = document.getElementById('input-carta');
            const numeroCarta = parseInt(input.value);

            if (isNaN(numeroCarta) || numeroCarta < 1 || numeroCarta > 32) {
                alert('Inserisci un numero tra 1 e 32');
                return;
            }

            cartaCorrente = CARTE[numeroCarta];
            rispostaAVista = false;
            rispostaBVista = false;

            // Calcola le risposte UNA SOLA VOLTA
            risposteCalcolate = calcolaRisposta();

            // Mostra info carta
            const tipoZona = cartaCorrente.tipo === 'riga' ? 'Riga' : 'Colonna';
            document.getElementById('carta-info').innerHTML = 
                `<strong>Carta ${numeroCarta}:</strong> ${getOggettoHtml(cartaCorrente.oggetto)} in ${tipoZona} ${cartaCorrente.zona}`;

            document.getElementById('area-risposte').classList.remove('hidden');

            // Aggiorna testi bottoni in base alla modalità
            if (modalitaGioco === 'remoto') {

                if (isMioTurno) {

                    document.getElementById('btn-giocatore-a').textContent = 'Vedi la tua risposta (Quantità)';

                    document.getElementById('btn-container-b').classList.remove('hidden');

            } else {
                // Modalità locale: mostra entrambi i bottoni con testi originali
                document.getElementById('btn-giocatore-a').textContent = 'Giocatore A (chi ha giocato)';
                document.getElementById('btn-giocatore-b').textContent = 'Giocatore B (chi non ha giocato)';
                document.getElementById('btn-container-a').classList.remove('hidden');
                document.getElementById('btn-container-b').classList.remove('hidden');

            document.getElementById('risposta-a').classList.add('hidden');
            document.getElementById('risposta-b').classList.add('hidden');
            document.getElementById('btn-chiudi-a').classList.add('hidden');
            document.getElementById('btn-chiudi-b').classList.add('hidden');
            document.getElementById('btn-prossima').classList.add('hidden');
            document.getElementById('btn-conferma').disabled = true;
        }

        function calcolaRisposta() {
            const zona = cartaCorrente.tipo === 'riga' ? RIGHE[cartaCorrente.zona] : COLONNE[cartaCorrente.zona];
            const oggettoCercato = cartaCorrente.oggetto;

            const caselleConOggetto = zona.filter(c => scheda[c] === oggettoCercato);
            const quantita = caselleConOggetto.length;

            let rispostaB;
            if (quantita === 0) {
                rispostaB = 'Quantità: 0';
            } else {
                const casellaCasuale = caselleConOggetto[Math.floor(Math.random() * caselleConOggetto.length)];
                rispostaB = `Posizione: ${casellaCasuale}`;
            }

            return {
                rispostaA: `Quantità: ${quantita}`,
                rispostaB: rispostaB
            };
        }

        function mostraRispostaA() {
            document.getElementById('risposta-a').textContent = risposteCalcolate.rispostaA;
            document.getElementById('risposta-a').classList.remove('hidden');
            document.getElementById('btn-giocatore-a').disabled = true;
            document.getElementById('btn-chiudi-a').classList.remove('hidden');
            rispostaAVista = true;
            verificaCompletamento();
        }

        function mostraRispostaB() {
            document.getElementById('risposta-b').textContent = risposteCalcolate.rispostaB;
            document.getElementById('risposta-b').classList.remove('hidden');
            document.getElementById('btn-giocatore-b').disabled = true;
            document.getElementById('btn-chiudi-b').classList.remove('hidden');
            rispostaBVista = true;
            verificaCompletamento();
        }

        function chiudiRispostaA() {
            document.getElementById('risposta-a').classList.add('hidden');
            document.getElementById('btn-chiudi-a').classList.add('hidden');
            document.getElementById('btn-container-a').classList.add('hidden');
            verificaCompletamento();
        }

        function chiudiRispostaB() {
            document.getElementById('risposta-b').classList.add('hidden');
            document.getElementById('btn-chiudi-b').classList.add('hidden');
            document.getElementById('btn-container-b').classList.add('hidden');
            verificaCompletamento();
        }

        function verificaCompletamento() {
            if (modalitaGioco === 'remoto') {
                // In modalità remota, ogni giocatore vede solo la sua risposta
                // Mostra "Prossima domanda" quando il giocatore ha visto e chiuso la sua risposta
                const isMioTurno = (giocatoreCorrente === turnoCorrente);

                if (isMioTurno) {
                    // Chi ha il turno vede risposta A
                    if (rispostaAVista) {
                        const rispostaAChiusa = document.getElementById('risposta-a').classList.contains('hidden');
                        if (rispostaAChiusa) {
                            document.getElementById('btn-prossima').classList.remove('hidden');
                        }
                    }
                } else {
                    // Chi non ha il turno vede risposta B
                    if (rispostaBVista) {
                        const rispostaBChiusa = document.getElementById('risposta-b').classList.contains('hidden');
                        if (rispostaBChiusa) {
                            document.getElementById('btn-prossima').classList.remove('hidden');
                        }
                    }
                }
            } else {
                // Modalità locale: aspetta che entrambe le risposte siano state viste e chiuse
                if (rispostaAVista && rispostaBVista) {
                    const rispostaAChiusa = document.getElementById('risposta-a').classList.contains('hidden');
                    const rispostaBChiusa = document.getElementById('risposta-b').classList.contains('hidden');

                    if (rispostaAChiusa && rispostaBChiusa) {
                        document.getElementById('btn-prossima').classList.remove('hidden');
                    }
                }
            }
        }

        function prossimaDomanda() {
            document.getElementById('area-risposte').classList.add('hidden');
            document.getElementById('input-carta').value = '';
            document.getElementById('btn-conferma').disabled = false;
            cartaCorrente = null;

            // Passa il turno in modalità remota
            if (modalitaGioco === 'remoto') {
                turnoCorrente = (turnoCorrente === 1) ? 2 : 1;
                aggiornaInterfacciaTurno();
            }
        }

        function apriAccusa() {
            document.getElementById('schermata-accusa').classList.remove('hidden');
            accusaPersonaggio = null;
            accusaOggetto = null;
            document.querySelectorAll('.accusa-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btn-conferma-accusa').disabled = true;
        }

        function chiudiAccusa() {
            document.getElementById('schermata-accusa').classList.add('hidden');
        }

        function selezionaPersonaggio(p, btn) {
            document.querySelectorAll('#grid-personaggi .accusa-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            accusaPersonaggio = p;
            verificaAccusa();
        }

        function selezionaOggetto(o, btn) {
            document.querySelectorAll('#grid-oggetti .accusa-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            accusaOggetto = o;
            verificaAccusa();
        }

        function verificaAccusa() {
            document.getElementById('btn-conferma-accusa').disabled = !(accusaPersonaggio !== null && accusaOggetto !== null);
        }

        function confermaAccusa() {
            const corretto = (accusaPersonaggio === colpevole && accusaOggetto === refurtivo);

            document.getElementById('schermata-gioco').classList.add('hidden');
            document.getElementById('area-accusa').classList.add('hidden');
            document.getElementById('schermata-accusa').classList.add('hidden');
            document.getElementById('schermata-esito').classList.remove('hidden');

            const esitoDiv = document.getElementById('esito-messaggio');
            if (corretto) {
                esitoDiv.className = 'esito esito-vittoria';
                esitoDiv.textContent = 'Corretto! Hai vinto!';
            } else {
                esitoDiv.className = 'esito esito-sconfitta';
                esitoDiv.innerHTML = `Sbagliato!<br><br>Il colpevole era: ${NOMI_PERSONAGGI[colpevole-1]}<br>Oggetto rubato: ${getOggettoHtml(refurtivo)}`;
            }

            // Mostra soluzione completa
            const soluzioneDiv = document.getElementById('soluzione-finale');
            soluzioneDiv.classList.remove('hidden');
            soluzioneDiv.innerHTML = '<h3 style="margin: 20px 0 16px; text-align: center;">Scheda completa</h3>';
            soluzioneDiv.innerHTML += generaGrigliaSoluzione();
        }


        function generaTabelloneVisuale() {
            // Struttura griglia 7x7:
            // Riga 1: _, A, _, B, _, C, _, D, _  -> ma usiamo 7 colonne
            // In realtà la struttura è:
            // Col:  1    2    3    4    5    6    7
            // R1:   A    -    B    -    C    -    D
            // R2:   -    P1   -    P2   -    P3   -
            // R3:   E    -    F    -    G    -    H
            // R4:   -    P4   -    P5   -    P6   -
            // R5:   I    -    J    -    K    -    L
            // R6:   -    P7   -    P8   -    P9   -
            // R7:   M    -    N    -    O    -    P

            const grid = [
                ['A', null, 'B', null, 'C', null, 'D'],
                [null, 1, null, 2, null, 3, null],
                ['E', null, 'F', null, 'G', null, 'H'],
                [null, 4, null, 5, null, 6, null],
                ['I', null, 'J', null, 'K', null, 'L'],
                [null, 7, null, 8, null, 9, null],
                ['M', null, 'N', null, 'O', null, 'P']
            ];

            let html = '<div class="tabellone-wrapper"><div class="tabellone-container">';
            
            for (let row = 0; row < 7; row++) {
                for (let col = 0; col < 7; col++) {
                    const cell = grid[row][col];
                    
                    if (cell === null) {
                        html += '<div class="cell-spacer"></div>';
                    } else if (typeof cell === 'string') {
                        // Casella oggetto (A-P)
                        const oggetto = scheda[cell];
                        html += `<div class="casella-obj">
                            <span class="label">${cell}</span>
                            ${getOggettoImg(oggetto)}
                        </div>`;
                    } else {
                        // Personaggio (1-9)
                        const isColpevole = cell === colpevole;
                        const classe = isColpevole ? 'personaggio-cell colpevole' : 'personaggio-cell';
                        html += `<div class="${classe}">
                            ${getPersonaggioImg(cell)}
                            <span class="nome">${NOMI_PERSONAGGI[cell-1]}</span>
                        </div>`;
                    }
                }
            }
            
            html += '</div></div>';
            
            // Info colpevole
            html += `<div class="info-soluzione">
                <div class="titolo">Soluzione</div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin: 8px 0;">
                    ${getPersonaggioImg(colpevole, true)}
                    <div style="text-align: left;">
                        <div><strong>Colpevole:</strong> ${NOMI_PERSONAGGI[colpevole-1]}</div>
                        <div style="margin-top: 4px;"><strong>Refurtiva:</strong> ${getOggettoHtml(refurtivo)}</div>
                    </div>
                </div>
            </div>`;

            
            
            return html;
        }

        function generaGrigliaSoluzione() {
            return generaTabelloneVisuale();
        }

        function mostraSoluzione() {
            if (colpevole === null) {
                alert('Devi prima iniziare una partita');
                return;
            }
            
            const password = document.getElementById('input-password').value;
            if (password === 'debug2024') {
                const gridDiv = document.getElementById('grid-soluzione');
                gridDiv.innerHTML = generaTabelloneVisuale();
                
                // Nascondi il vecchio info-colpevole (ora è integrato nel tabellone)
                document.getElementById('info-colpevole').innerHTML = '';

                document.getElementById('schermata-soluzione').classList.remove('hidden');
                document.getElementById('input-password').value = '';
            } else {
                alert('Password errata');
            }
        }

        function chiudiSoluzione() {
            document.getElementById('schermata-soluzione').classList.add('hidden');
        }
    </script>
</body>
